<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harsha's Blog | Loading...</title>
    <!-- Premium Icons -->
    <link href="https://unpkg.com/lucide@latest/icons/lucide.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css/style.css">

    <!-- Code Highlighting (One Dark theme for dark mode matching) -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">

    <style>
        /* Extra styles for rendered markdown specific to post.html */
        .markdown-body pre {
            background-color: var(--nav-bg) !important;
            border: 1px solid var(--card-border);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            overflow-x: auto;
            margin: 2rem 0;
            font-size: 0.95rem;
        }

        .markdown-body code {
            font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
            background: rgba(128, 128, 128, 0.1);
            padding: 0.2em 0.4em;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .markdown-body pre code {
            background: none;
            padding: 0;
            border-radius: 0;
        }

        .markdown-body h2,
        .markdown-body h3 {
            margin-top: 3rem;
        }
    </style>
</head>

<body>
    <div class="bg-gradient"></div>
    <div class="bg-gradient-2"></div>

    <nav>
        <div class="nav-container">
            <a href="../index.html" class="logo">
                <i data-lucide="terminal" style="color: var(--accent-color)"></i>
                Harsha<span>Blog</span>
            </a>
            <div class="nav-links">
                <a href="https://hthumbaraguddi.github.io">About</a>
                <a href="https://github.com/hthumbaraguddi" target="_blank">GitHub</a>
                <button class="theme-toggle" id="theme-toggle" aria-label="Toggle Theme">
                    <i data-lucide="sun" class="sun-icon"></i>
                </button>
            </div>
        </div>
    </nav>

    <main>
        <article class="post">
            <a href="../index.html" class="back-link">
                <i data-lucide="arrow-left" style="width: 1rem; height: 1rem;"></i>
                Back to posts
            </a>

            <header class="post-header">
                <h1 id="post-title">Loading...</h1>
                <div class="post-meta" style="justify-content: center;">
                    <span class="tag" id="post-tag">...</span>
                    <time id="post-date">...</time>
                </div>
            </header>

            <div class="post-content markdown-body" id="post-content">
                <!-- Markdown content will be rendered here -->
            </div>
        </article>
    </main>

    <footer>
        <p>&copy; 2026 Harsha. Open source on GitHub.</p>
    </footer>

    <script src="../js/main.js"></script>
    <script>
        lucide.createIcons();
    </script>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js for Code syntax -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');

            if (!postId) {
                document.getElementById('post-title').textContent = 'Post Not Found';
                return;
            }

            try {
                // Fetch the metadata first to populate headers
                const jsonResponse = await fetch('posts.json');
                const posts = await jsonResponse.json();
                const postMeta = posts.find(p => p.id === postId);

                if (postMeta) {
                    document.getElementById('post-title').textContent = postMeta.title;
                    document.getElementById('post-tag').textContent = postMeta.tag;
                    const dateEl = document.getElementById('post-date');
                    dateEl.textContent = postMeta.date;
                    dateEl.setAttribute('datetime', postMeta.datetime);
                    document.title = `${postMeta.title} | Harsha's Blog`;
                } else {
                    document.getElementById('post-title').textContent = 'Post Data Missing';
                }

                // Fetch and render the markdown
                const mdResponse = await fetch(`${postId}.md`);
                if (mdResponse.ok) {
                    const mdText = await mdResponse.text();

                    // Configure marked to use highlight.js
                    marked.setOptions({
                        highlight: function (code, lang) {
                            const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                            return hljs.highlight(code, { language }).value;
                        },
                        langPrefix: 'hljs language-'
                    });

                    document.getElementById('post-content').innerHTML = marked.parse(mdText);
                } else {
                    document.getElementById('post-content').innerHTML = '<p>Could not load the content for this post.</p>';
                }
            } catch (error) {
                console.error("Error loading post:", error);
                document.getElementById('post-title').textContent = 'Error Loading Post';
            }
        });
    </script>
</body>

</html>
