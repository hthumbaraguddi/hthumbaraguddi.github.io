<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harsha's Blog | Thoughts & Code</title>
    <meta name="description" content="A personal blog sharing thoughts on technology, development, and life.">
    <!-- Premium Icons -->
    <link href="https://unpkg.com/lucide@latest/icons/lucide.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div class="bg-gradient"></div>
    <div class="bg-gradient-2"></div>

    <nav>
        <div class="nav-container">
            <a href="index.html" class="logo">
                <i data-lucide="terminal" style="color: var(--accent-color)"></i>
                Harsha<span>Blog</span>
            </a>
            <div class="nav-links">
                <a href="#about">About</a>
                <a href="https://github.com/harsha" target="_blank">GitHub</a>
                <button class="theme-toggle" id="theme-toggle" aria-label="Toggle Theme">
                    <i data-lucide="sun" class="sun-icon"></i>
                </button>
            </div>
        </div>
    </nav>

    <main>
        <header class="hero">
            <h1>Writing on tech, life, and everything between.</h1>
            <p>Welcome to my digital garden. Here you'll find tutorials, thoughts on software architecture, and
                reflections on continuous learning.</p>
        </header>

        <section class="posts-grid" id="posts-grid">
            <!-- Posts will be generated dynamically via JS below -->
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Harsha. Open source on GitHub.</p>
    </footer>

    <script src="./js/main.js"></script>
    <script>
        lucide.createIcons();

        // Fetch posts metadata and populate homepage grid
        document.addEventListener('DOMContentLoaded', async () => {
            const grid = document.getElementById('posts-grid');
            try {
                const response = await fetch('./posts/posts.json');
                const posts = await response.json();

                if (posts.length === 0) {
                    grid.innerHTML = '<p>No posts yet.</p>';
                    return;
                }

                grid.innerHTML = posts.map(post => `
                    <a href="posts/post.html?id=${post.id}" class="post-card">
                        <div class="post-meta">
                            <span class="tag">${post.tag}</span>
                            <time datetime="${post.datetime}">${post.date}</time>
                        </div>
                        <h2 class="post-title">${post.title}</h2>
                        <p class="post-excerpt">${post.excerpt}</p>
                    </a>
                `).join('');

                // Apply scroll animation observers on grid children manually after injection
                const observerOptions = { root: null, rootMargin: '0px', threshold: 0.1 };
                const observer = new IntersectionObserver((entries, obs) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.style.opacity = '1';
                            entry.target.style.transform = 'translateY(0)';
                            obs.unobserve(entry.target);
                        }
                    });
                }, observerOptions);

                Array.from(grid.children).forEach(el => {
                    el.style.opacity = '0';
                    el.style.transform = 'translateY(20px)';
                    el.style.transition = 'all 0.6s cubic-bezier(0.25, 0.8, 0.25, 1)';
                    observer.observe(el);
                });

            } catch (err) {
                console.error("Failed to load posts", err);
                grid.innerHTML = '<p style="color:var(--text-secondary)">Cannot load posts at this time.</p>';
            }
        });
    </script>
</body>

</html>
